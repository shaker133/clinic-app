<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تغيير كلمة المرور - عيادة العلاج الطبيعي</title>
<link rel="stylesheet" href="style.css">
<script src="auth.js"></script>
<script>requireAuth();</script>
</head>
<body>

<header class="main-header">
  <div class="container header-content">
    <div class="logo">
      <span class="logo-icon">🏥</span>
      <h1>عيادة العلاج الطبيعي</h1>
    </div>
    <nav>
      <a href="index.html">حجز موعد</a>
      <a href="admin.html">لوحة التحكم</a>
      <a href="appointments.html">المواعيد</a>
      <a href="change-password.html" class="active">🔐 كلمة المرور</a>
      <a href="#" onclick="logout();return false;" class="logout-link">🚪 خروج</a>
    </nav>
  </div>
</header>

<main class="container">
  <section>
    <div class="card" style="max-width:600px;margin:30px auto;">
      <h2>🔐 تغيير بيانات الدخول</h2>

      <div class="user-info-box">
        <span>👤 المستخدم الحالي:</span>
        <strong id="currentUsername">—</strong>
      </div>

      <h3 style="margin-top:25px;margin-bottom:15px;color:#0d47a1;font-size:17px;">
        تغيير اسم المستخدم
      </h3>

      <div class="form-group">
        <label for="newUsername">👤 اسم المستخدم الجديد</label>
        <input type="text" id="newUsername" placeholder="3 أحرف على الأقل">
      </div>
      <button id="changeUsernameBtn" class="btn-primary" style="margin-bottom:25px;">
        💾 حفظ اسم المستخدم
      </button>

      <hr style="margin:25px 0;border:none;border-top:2px solid #e3f2fd;">

      <h3 style="margin-bottom:15px;color:#0d47a1;font-size:17px;">
        تغيير كلمة المرور
      </h3>

      <div class="form-group">
        <label for="oldPass">🔒 كلمة المرور الحالية</label>
        <input type="password" id="oldPass" placeholder="أدخل كلمة المرور الحالية">
      </div>

      <div class="form-group">
        <label for="newPass">🔑 كلمة المرور الجديدة</label>
        <input type="password" id="newPass" placeholder="6 أحرف على الأقل">
      </div>

      <div class="form-group">
        <label for="confirmPass">🔑 تأكيد كلمة المرور</label>
        <input type="password" id="confirmPass" placeholder="أعد إدخال كلمة المرور">
      </div>

      <button id="changePassBtn" class="btn-primary">💾 حفظ كلمة المرور</button>

      <div id="passMessage" class="message"></div>
    </div>
  </section>
</main>

<footer class="main-footer">
  <p>© 2025 عيادة العلاج الطبيعي - جميع الحقوق محفوظة</p>
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const user = getCurrentUser();
  if (user) document.getElementById('currentUsername').textContent = user.username;

  // تغيير اسم المستخدم
  document.getElementById('changeUsernameBtn').addEventListener('click', () => {
    const newUsername = document.getElementById('newUsername').value.trim();
    const msgEl = document.getElementById('passMessage');
    const result = changeUsername(newUsername);

    if (result.success) {
      msgEl.textContent = '✅ ' + result.message;
      msgEl.className = 'message success';
      document.getElementById('currentUsername').textContent = newUsername;
      document.getElementById('newUsername').value = '';
    } else {
      msgEl.textContent = '❌ ' + result.message;
      msgEl.className = 'message error';
    }
  });

  // تغيير كلمة المرور
  document.getElementById('changePassBtn').addEventListener('click', () => {
    const oldPass = document.getElementById('oldPass').value;
    const newPass = document.getElementById('newPass').value;
    const confirmPass = document.getElementById('confirmPass').value;
    const msgEl = document.getElementById('passMessage');

    const result = changePassword(oldPass, newPass, confirmPass);

    if (result.success) {
      msgEl.textContent = '✅ ' + result.message + ' - سيتم تسجيل خروجك خلال 3 ثوانٍ';
      msgEl.className = 'message success';
      setTimeout(() => {
        logout();
      }, 3000);
    } else {
      msgEl.textContent = '❌ ' + result.message;
      msgEl.className = 'message error';
    }
  });
});
</script>
</body>
</html>
